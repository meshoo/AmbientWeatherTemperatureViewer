services:
  app:
    build: .
    container_name: claudeawgraphs-app
    # Bind to localhost only — Tailscale on the host exposes this as HTTPS
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - AW_API_KEY=${AW_API_KEY}
      - AW_APP_KEY=${AW_APP_KEY}
      - AW_DEVICE_MAC=${AW_DEVICE_MAC}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - PORT=3000
      - NODE_ENV=production
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-365}
    volumes:
      # SQLite database persists across container restarts
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/admin/status"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  app-data:
